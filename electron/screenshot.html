<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden; cursor: crosshair;
    background: #000;
    user-select: none;
  }

  /* 屏幕截图预览：每个显示器一张 img，绝对定位到对应位置 */
  #screenContainer { position: fixed; inset: 0; z-index: 1; }
  .screen-img {
    position: absolute; display: block;
    -webkit-user-drag: none; pointer-events: none;
  }

  /* Snipaste 式遮罩：4 个遮罩 div + 选区边框，全部 GPU 合成层 */
  .mask {
    position: fixed;
    background: rgba(0, 0, 0, 0.45);
    will-change: transform;
    transform: translateZ(0);
    z-index: 2;
  }
  .mask-top    { left: 0; top: 0; right: 0; }
  .mask-bottom { left: 0; bottom: 0; right: 0; }
  .mask-left   { left: 0; top: 0; }
  .mask-right  { right: 0; top: 0; }

  .selection {
    position: fixed;
    display: none;
    border: 1.5px solid #007aff;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.35) inset;
    will-change: transform;
    transform: translateZ(0);
    z-index: 3;
  }

  .size-label {
    position: fixed;
    display: none;
    padding: 2px 6px;
    background: #007aff;
    color: #fff;
    font: 12px/1.4 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    border-radius: 4px;
    white-space: nowrap;
    pointer-events: none;
    will-change: transform;
    transform: translateZ(0);
    z-index: 3;
  }
</style>
</head>
<body>
  <div id="screenContainer"></div>
  <div class="mask mask-top" id="maskTop"></div>
  <div class="mask mask-bottom" id="maskBottom"></div>
  <div class="mask mask-left" id="maskLeft"></div>
  <div class="mask mask-right" id="maskRight"></div>
  <div class="selection" id="selection"></div>
  <div class="size-label" id="sizeLabel"></div>

<script>
  (function () {
    var api = window.electronAPI || {}
    var container = document.getElementById('screenContainer')
    var maskTop = document.getElementById('maskTop')
    var maskBottom = document.getElementById('maskBottom')
    var maskLeft = document.getElementById('maskLeft')
    var maskRight = document.getElementById('maskRight')
    var selection = document.getElementById('selection')
    var sizeLabel = document.getElementById('sizeLabel')

    var startX = 0, startY = 0, curX = 0, curY = 0
    var drawing = false

    // 重置选区遮罩、边框、标签到初始状态（窗口复用场景）
    function resetOverlay() {
      drawing = false
      startX = 0; startY = 0; curX = 0; curY = 0
      maskTop.style.height = '0px'
      maskBottom.style.top = '100%'
      maskLeft.style.top = '0px'
      maskLeft.style.height = '0px'
      maskLeft.style.width = '0px'
      maskRight.style.top = '0px'
      maskRight.style.left = '100%'
      maskRight.style.height = '0px'
      selection.style.display = 'none'
      sizeLabel.style.display = 'none'
    }

    // 接收主进程发来的屏幕预览数据，渲染各显示器截图
    api.onScreenshotData && api.onScreenshotData(function (data) {
      // 清空旧预览与上次的选区状态（窗口复用场景）
      container.innerHTML = ''
      resetOverlay()
      var displays = data.displays || []
      if (displays.length === 0) {
        api.screenshotReady && api.screenshotReady()
        return
      }
      var pending = displays.length
      displays.forEach(function (d) {
        var img = new Image()
        img.className = 'screen-img'
        img.style.left = d.x + 'px'
        img.style.top = d.y + 'px'
        img.style.width = d.width + 'px'
        img.style.height = d.height + 'px'
        img.onload = function () {
          container.appendChild(img)
          if (--pending === 0) {
            // 所有预览图加载完成后再通知主进程显示窗口
            api.screenshotReady && api.screenshotReady()
          }
        }
        img.onerror = function () {
          if (--pending === 0) {
            api.screenshotReady && api.screenshotReady()
          }
        }
        img.src = d.image
      })
    })

    function update() {
      var x = Math.min(startX, curX)
      var y = Math.min(startY, curY)
      var w = Math.abs(curX - startX)
      var h = Math.abs(curY - startY)

      maskTop.style.height = y + 'px'
      maskBottom.style.top = (y + h) + 'px'
      maskLeft.style.top = y + 'px'
      maskLeft.style.height = h + 'px'
      maskLeft.style.width = x + 'px'
      maskRight.style.top = y + 'px'
      maskRight.style.left = (x + w) + 'px'
      maskRight.style.height = h + 'px'

      selection.style.display = 'block'
      selection.style.transform = 'translate(' + x + 'px,' + y + 'px)'
      selection.style.width = w + 'px'
      selection.style.height = h + 'px'

      sizeLabel.style.display = 'block'
      sizeLabel.textContent = Math.round(w) + ' × ' + Math.round(h)
      sizeLabel.style.transform = 'translate(' + x + 'px,' + (y > 22 ? y - 24 : y + h + 6) + 'px)'
    }

    function onDown(e) {
      if (e.button !== 0) return
      drawing = true
      startX = e.clientX; startY = e.clientY
      curX = e.clientX; curY = e.clientY
      update()
    }

    function onMove(e) {
      if (!drawing) return
      curX = e.clientX; curY = e.clientY
      update()
    }

    function onUp(e) {
      if (!drawing || e.button !== 0) return
      drawing = false
      curX = e.clientX; curY = e.clientY
      var x = Math.round(Math.min(startX, curX))
      var y = Math.round(Math.min(startY, curY))
      var w = Math.round(Math.abs(curX - startX))
      var h = Math.round(Math.abs(curY - startY))
      if (w < 3 || h < 3) {
        api.screenshotCancel && api.screenshotCancel()
        return
      }
      api.screenshotSelect && api.screenshotSelect({ x: x, y: y, w: w, h: h })
    }

    window.addEventListener('mousedown', onDown)
    window.addEventListener('mousemove', onMove)
    window.addEventListener('mouseup', onUp)

    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        e.preventDefault()
        api.screenshotCancel && api.screenshotCancel()
      }
    })

    window.addEventListener('contextmenu', function (e) {
      e.preventDefault()
      api.screenshotCancel && api.screenshotCancel()
    })
  })()
</script>
</body>
</html>
