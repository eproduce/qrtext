<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden; cursor: crosshair;
    background: #000;
    user-select: none;
  }

  /* 屏幕截图预览：每个显示器一张 img，绝对定位到对应位置 */
  #screenContainer { position: fixed; inset: 0; z-index: 1; }
  .screen-img {
    position: absolute; display: block;
    -webkit-user-drag: none; pointer-events: none;
  }

  /* 单一 canvas 覆盖层：遮罩 + 选区边框 + 尺寸标签在同一次绘制中原子完成，
     每帧只呈现完整状态，杜绝多个 div 各自更新不同步导致的
     撕裂 / “L、X”形回字形残影 */
  #overlay {
    position: fixed; inset: 0; z-index: 2;
    display: block;
    cursor: crosshair;
  }
</style>
</head>
<body>
  <div id="screenContainer"></div>
  <canvas id="overlay"></canvas>

<script>
  (function () {
    var api = window.electronAPI || {}
    var container = document.getElementById('screenContainer')
    var canvas = document.getElementById('overlay')
    var ctx = canvas.getContext('2d')

    var startX = 0, startY = 0, curX = 0, curY = 0
    var drawing = false

    // 按 devicePixelRatio 设置画布物理尺寸，保证边框/文字清晰
    function resizeCanvas() {
      var dpr = window.devicePixelRatio || 1
      canvas.width = Math.round(window.innerWidth * dpr)
      canvas.height = Math.round(window.innerHeight * dpr)
      canvas.style.width = window.innerWidth + 'px'
      canvas.style.height = window.innerHeight + 'px'
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
      draw()
    }

    function roundedRect(x, y, w, h, r) {
      var rr = Math.max(0, Math.min(r, w / 2, h / 2))
      if (ctx.roundRect) {
        ctx.beginPath()
        ctx.roundRect(x, y, w, h, rr)
        return
      }
      ctx.beginPath()
      ctx.moveTo(x + rr, y)
      ctx.arcTo(x + w, y, x + w, y + h, rr)
      ctx.arcTo(x + w, y + h, x, y + h, rr)
      ctx.arcTo(x, y + h, x, y, rr)
      ctx.arcTo(x, y, x + w, y, rr)
      ctx.closePath()
    }

    // 单次原子绘制：遮罩 → 挖空选区 → 边框 → 尺寸标签。
    // 所有元素在同一帧内同步更新，绝不出现中间态（L/X/回字形残影）。
    function draw() {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight)
      if (!drawing) return
      var x = Math.min(startX, curX)
      var y = Math.min(startY, curY)
      var w = Math.abs(curX - startX)
      var h = Math.abs(curY - startY)
      if (w < 1 || h < 1) return

      // 半透明遮罩铺满全屏
      ctx.fillStyle = 'rgba(0, 0, 0, 0.45)'
      ctx.fillRect(0, 0, window.innerWidth, window.innerHeight)

      // 挖空选区，露出下方屏幕预览
      ctx.clearRect(x, y, w, h)

      // 蓝色外框 + 内层白边
      ctx.strokeStyle = '#007aff'
      ctx.lineWidth = 1.5
      ctx.strokeRect(x, y, w, h)
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)'
      ctx.lineWidth = 1
      ctx.strokeRect(x + 1, y + 1, w - 2, h - 2)

      // 尺寸标签
      var label = Math.round(w) + ' × ' + Math.round(h)
      ctx.font = '12px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'
      var tw = ctx.measureText(label).width
      var bw = tw + 12
      var bh = 20
      var lx = x
      var ly = y > bh + 6 ? y - bh - 6 : y + h + 6
      if (lx + bw > window.innerWidth) lx = window.innerWidth - bw
      if (ly + bh > window.innerHeight) ly = window.innerHeight - bh
      if (lx < 0) lx = 0
      if (ly < 0) ly = 0
      ctx.fillStyle = '#007aff'
      roundedRect(lx, ly, bw, bh, 4)
      ctx.fill()
      ctx.fillStyle = '#fff'
      ctx.fillText(label, lx + 6, ly + 14)
    }

    // 重置选区（窗口复用场景）
    function resetOverlay() {
      drawing = false
      startX = 0; startY = 0; curX = 0; curY = 0
      draw()
    }

    // 接收主进程发来的屏幕预览数据，渲染各显示器截图
    api.onScreenshotData && api.onScreenshotData(function (data) {
      // 清空旧预览与上次的选区状态（窗口复用场景），并校准画布尺寸
      container.innerHTML = ''
      resizeCanvas()
      resetOverlay()
      var displays = data.displays || []
      if (displays.length === 0) {
        api.screenshotReady && api.screenshotReady()
        return
      }
      var notified = false
      displays.forEach(function (d) {
        var img = new Image()
        img.className = 'screen-img'
        img.style.left = d.x + 'px'
        img.style.top = d.y + 'px'
        img.style.width = d.width + 'px'
        img.style.height = d.height + 'px'
        function ready() {
          if (!notified) {
            notified = true
            // 第一张预览图就绪即显示窗口（Snipaste 式即时反馈），
            // 其余屏幕继续异步加载，避免等全部就绪时的黑屏卡顿
            api.screenshotReady && api.screenshotReady()
          }
        }
        img.onload = function () {
          container.appendChild(img)
          ready()
        }
        img.onerror = ready
        img.src = d.image
      })
    })

    function onDown(e) {
      if (e.button !== 0) return
      drawing = true
      startX = e.clientX; startY = e.clientY
      curX = e.clientX; curY = e.clientY
      draw()
    }

    function onMove(e) {
      if (!drawing) return
      curX = e.clientX; curY = e.clientY
      draw()
    }

    function onUp(e) {
      if (!drawing || e.button !== 0) return
      drawing = false
      curX = e.clientX; curY = e.clientY
      draw()
      var x = Math.round(Math.min(startX, curX))
      var y = Math.round(Math.min(startY, curY))
      var w = Math.round(Math.abs(curX - startX))
      var h = Math.round(Math.abs(curY - startY))
      if (w < 3 || h < 3) {
        api.screenshotCancel && api.screenshotCancel()
        return
      }
      api.screenshotSelect && api.screenshotSelect({ x: x, y: y, w: w, h: h })
    }

    window.addEventListener('mousedown', onDown)
    window.addEventListener('mousemove', onMove)
    window.addEventListener('mouseup', onUp)

    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        e.preventDefault()
        api.screenshotCancel && api.screenshotCancel()
      }
    })

    window.addEventListener('contextmenu', function (e) {
      e.preventDefault()
      api.screenshotCancel && api.screenshotCancel()
    })

    resizeCanvas()
    window.addEventListener('resize', resizeCanvas)
  })()
</script>
</body>
</html>
