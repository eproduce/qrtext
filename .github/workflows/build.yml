name: Build & Release
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── 全平台构建（Electron + electron-builder） ──
  build:
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Linux 依赖（AppImage/RPM 打包所需）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfuse2 \
            rpm \
            libgtk-3-0 \
            libnotify4 \
            libnss3 \
            libxss1 \
            libxtst6 \
            xdg-utils \
            libatspi2.0-0 \
            libdrm2 \
            libgbm1

      - name: 安装依赖（用 install 因为 package.json 改了，lock 不同步）
        run: npm install

      - name: 构建前端
        run: npx vite build

      - name: 打包 Electron（Linux 含 ARM）
        if: runner.os == 'Linux'
        run: npx electron-builder --publish=never --linux --x64 --arm64 --armv7l
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: 打包 Electron（macOS / Windows）
        if: runner.os != 'Linux'
        run: npx electron-builder --publish=never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.exe
            release/*.zip
          if-no-files-found: warn

  # ── 发布 Release ──
  release:
    needs: [build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: 生成 CHANGELOG & 创建 Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          VER=$(node -p "require('./package.json').version")
          SHA=$(git rev-parse --short=7 HEAD)
          TAG="v${VER}-${SHA}"
          echo "版本: ${VER}   commit: ${SHA}   tag: ${TAG}"

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          TODAY=$(date +%Y-%m-%d)

          # 更新 CHANGELOG
          TITLE_END=$(grep -n '^## ' CHANGELOG.md | head -1 | cut -d: -f1)
          TITLE_END=$((TITLE_END - 1))
          head -n $TITLE_END CHANGELOG.md > /tmp/new-changelog.md
          {
            echo ""
            echo "## ${VER} (${TODAY})"
            echo ""
            echo "- 自动构建 (Electron)"
            echo ""
          } >> /tmp/new-changelog.md
          tail -n +$((TITLE_END + 1)) CHANGELOG.md >> /tmp/new-changelog.md
          mv /tmp/new-changelog.md CHANGELOG.md

          sed -i "s/当前版本：\*\*[0-9.]*\*\*/当前版本：**${VER}**/" README.md

          git add CHANGELOG.md README.md
          git commit -m "docs: update changelog for ${VER} [skip ci]" || echo "(无变更)"
          git push origin main

          git tag "${TAG}"
          git push origin "${TAG}"

          echo "tag=${TAG}" >> $GITHUB_OUTPUT
        id: bump

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: ${{ steps.bump.outputs.tag }}
          files: packages/**
          make_latest: true
