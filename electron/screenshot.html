<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden; cursor: crosshair;
    background: #000;
    user-select: none;
  }

  /* 屏幕截图预览：每个显示器一张 img，绝对定位到对应位置 */
  #screenContainer { position: fixed; inset: 0; z-index: 1; }
  .screen-img {
    position: absolute; display: block;
    -webkit-user-drag: none; pointer-events: none;
  }

  /* 单一 canvas 覆盖层：遮罩 + 选区边框 + 尺寸标签在同一次绘制中原子完成，
     每帧只呈现完整状态，杜绝多个 div 各自更新不同步导致的
     撕裂 / “L、X”形回字形残影 */
  #overlay {
    position: fixed; inset: 0; z-index: 2;
    display: block;
    cursor: crosshair;
  }
</style>
</head>
<body>
  <div id="screenContainer"></div>
  <canvas id="overlay"></canvas>

<script>
  (function () {
    var api = window.electronAPI || {}
    var container = document.getElementById('screenContainer')
    var canvas = document.getElementById('overlay')
    var ctx = canvas.getContext('2d')

    var MASK = 'rgba(0, 0, 0, 0.45)'
    var vw = window.innerWidth
    var vh = window.innerHeight
    var startX = 0, startY = 0, curX = 0, curY = 0
    var drawing = false

    // 画布状态：maskReady=true 表示整屏已铺好一层均匀遮罩；
    // carved 记录当前被「凿开」的区域（选区洞 + 尺寸标签底），
    // 选框移动时先把这些区域还原成遮罩，再凿新洞 —— 只重绘变化的部分
    var maskReady = false
    var carved = []

    // 按 devicePixelRatio 设置画布物理尺寸，保证边框/文字清晰
    function resizeCanvas() {
      vw = window.innerWidth
      vh = window.innerHeight
      var dpr = window.devicePixelRatio || 1
      canvas.width = Math.round(vw * dpr)
      canvas.height = Math.round(vh * dpr)
      canvas.style.width = vw + 'px'
      canvas.style.height = vh + 'px'
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
      resetOverlay()
    }

    // 完全清空画布并复位状态（窗口复用 / 尺寸变化时调用）
    function resetOverlay() {
      drawing = false
      startX = 0; startY = 0; curX = 0; curY = 0
      ctx.clearRect(0, 0, vw, vh)
      maskReady = false
      carved = []
    }

    // 铺满一层遮罩：先整屏清空再整屏填充，保证每像素恰好一层 0.45 遮罩
    function fillMask() {
      ctx.clearRect(0, 0, vw, vh)
      ctx.fillStyle = MASK
      ctx.fillRect(0, 0, vw, vh)
      maskReady = true
      carved = []
    }

    // 把之前凿开的区域（旧洞/旧标签）恢复成遮罩：先清成透明再铺一层，
    // 即使与初铺遮罩重叠也只叠加一次，不会变深
    function restoreCarved() {
      ctx.fillStyle = MASK
      for (var i = 0; i < carved.length; i++) {
        var c = carved[i]
        ctx.clearRect(c.x, c.y, c.w, c.h)
        ctx.fillRect(c.x, c.y, c.w, c.h)
      }
      carved = []
    }

    function roundedRect(x, y, w, h, r) {
      var rr = Math.max(0, Math.min(r, w / 2, h / 2))
      if (ctx.roundRect) {
        ctx.beginPath()
        ctx.roundRect(x, y, w, h, rr)
        return
      }
      ctx.beginPath()
      ctx.moveTo(x + rr, y)
      ctx.arcTo(x + w, y, x + w, y + h, rr)
      ctx.arcTo(x + w, y + h, x, y + h, rr)
      ctx.arcTo(x, y + h, x, y, rr)
      ctx.arcTo(x, y, x + w, y, rr)
      ctx.closePath()
    }

    // 画蓝色外框 + 内层白边 + 尺寸标签，返回标签矩形（用于下次还原）
    function drawFrame(x, y, w, h) {
      ctx.strokeStyle = '#007aff'
      ctx.lineWidth = 1.5
      ctx.strokeRect(x, y, w, h)
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)'
      ctx.lineWidth = 1
      ctx.strokeRect(x + 1, y + 1, w - 2, h - 2)

      var label = Math.round(w) + ' × ' + Math.round(h)
      ctx.font = '12px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'
      var tw = ctx.measureText(label).width
      var bw = tw + 12
      var bh = 20
      var lx = x
      var ly = y > bh + 6 ? y - bh - 6 : y + h + 6
      if (lx + bw > vw) lx = vw - bw
      if (ly + bh > vh) ly = vh - bh
      if (lx < 0) lx = 0
      if (ly < 0) ly = 0
      ctx.fillStyle = '#007aff'
      roundedRect(lx, ly, bw, bh, 4)
      ctx.fill()
      ctx.fillStyle = '#fff'
      ctx.fillText(label, lx + 6, ly + 14)
      return { x: lx, y: ly, w: bw, h: bh }
    }

    // 把选区洞迁移到 r：只重绘变化的区域（旧洞/旧标签 → 遮罩，再凿新洞、
    // 描边），避免每帧整屏 clear+fill 在软件渲染/高分屏下导致选框卡顿断续。
    // 仅拖动首帧整屏铺一次遮罩
    function moveHoleTo(r) {
      if (!maskReady) fillMask()
      else restoreCarved()

      ctx.clearRect(r.x, r.y, r.w, r.h)
      var labelRect = drawFrame(r.x, r.y, r.w, r.h)
      carved = [
        { x: r.x, y: r.y, w: r.w, h: r.h },
        labelRect,
      ]
    }

    // rAF 合并鼠标事件：事件到达频率常高于屏幕刷新率，逐事件整屏重绘会
    // 堆积出「顿一下跳一下」的断续感；合并到每帧只按最新位置重绘一次，
    // 并跳过尺寸未变化的帧，选框即可平滑跟随鼠标
    var rafPending = false
    var lastPainted = null
    function schedulePaint() {
      if (rafPending) return
      rafPending = true
      requestAnimationFrame(function () {
        rafPending = false
        if (!drawing) return
        var x = Math.min(startX, curX)
        var y = Math.min(startY, curY)
        var w = Math.abs(curX - startX)
        var h = Math.abs(curY - startY)
        if (w < 1 || h < 1) return
        if (lastPainted && lastPainted.x === x && lastPainted.y === y &&
            lastPainted.w === w && lastPainted.h === h) return
        moveHoleTo({ x: x, y: y, w: w, h: h })
        lastPainted = { x: x, y: y, w: w, h: h }
      })
    }

    // 接收主进程发来的屏幕预览数据，渲染各显示器截图
    api.onScreenshotData && api.onScreenshotData(function (data) {
      // 清空旧预览与上次的选区状态（窗口复用场景），并校准画布尺寸
      container.innerHTML = ''
      resizeCanvas()
      resetOverlay()
      var displays = data.displays || []
      if (displays.length === 0) {
        api.screenshotReady && api.screenshotReady()
        return
      }
      var notified = false
      displays.forEach(function (d) {
        var img = new Image()
        img.className = 'screen-img'
        img.style.left = d.x + 'px'
        img.style.top = d.y + 'px'
        img.style.width = d.width + 'px'
        img.style.height = d.height + 'px'
        function ready() {
          if (!notified) {
            notified = true
            // 第一张预览图就绪即显示窗口（Snipaste 式即时反馈），
            // 其余屏幕继续异步加载，避免等全部就绪时的黑屏卡顿
            api.screenshotReady && api.screenshotReady()
          }
        }
        img.onload = function () {
          container.appendChild(img)
          ready()
        }
        img.onerror = ready
        img.src = d.image
      })
    })

    function onDown(e) {
      if (e.button !== 0 || drawing) return
      drawing = true
      // 重新开始一次完整选区：清掉上次可能残留的遮罩/标签/旧洞
      ctx.clearRect(0, 0, vw, vh)
      maskReady = false
      carved = []
      lastPainted = null
      startX = e.clientX; startY = e.clientY
      curX = e.clientX; curY = e.clientY
      schedulePaint()
    }

    function onMove(e) {
      if (!drawing) return
      curX = e.clientX; curY = e.clientY
      schedulePaint()
    }

    function onUp(e) {
      if (!drawing || e.button !== 0) return
      drawing = false
      curX = e.clientX; curY = e.clientY
      var x = Math.round(Math.min(startX, curX))
      var y = Math.round(Math.min(startY, curY))
      var w = Math.round(Math.abs(curX - startX))
      var h = Math.round(Math.abs(curY - startY))
      if (w < 3 || h < 3) {
        resetOverlay()
        api.screenshotCancel && api.screenshotCancel()
        return
      }
      api.screenshotSelect && api.screenshotSelect({ x: x, y: y, w: w, h: h })
    }

    window.addEventListener('mousedown', onDown)
    window.addEventListener('mousemove', onMove)
    window.addEventListener('mouseup', onUp)

    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        e.preventDefault()
        api.screenshotCancel && api.screenshotCancel()
      }
    })

    window.addEventListener('contextmenu', function (e) {
      e.preventDefault()
      api.screenshotCancel && api.screenshotCancel()
    })

    resizeCanvas()
    window.addEventListener('resize', resizeCanvas)
  })()
</script>
</body>
</html>
